name: Android CI

on:
  push:
    branches: [main, "work/**", "fix/**"]
  pull_request:
    branches: [main, "work/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

  debug-build:
    name: Debug APK build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon assembleDebug --stacktrace
      - uses: actions/upload-artifact@v5
        with:
          name: 3D-Mega-Hub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release-build-check:
    name: Release build and R8 check (unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon assembleRelease --stacktrace

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon lintDebug --stacktrace
