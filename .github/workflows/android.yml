      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon minifyReleaseWithR8 --stacktrace

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
