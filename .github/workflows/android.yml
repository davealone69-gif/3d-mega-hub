name: Android CI

on:
  push:
    branches: [main, "work/**", "fix/**", "integration/**", "arena/**"]
  pull_request:
    branches: [main, "work/**", "fix/**", "integration/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  native-regression:
    name: Native C++ sampling regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure host native tests
        run: cmake -S avatarforge-engine/src/main/cpp -B build/native-tests -DBUILD_TESTING=ON -DAF_OPT_FLAGS=-O1
      - name: Build native regression target
        run: cmake --build build/native-tests --parallel 2
      - name: Run native regression tests
        run: ctest --test-dir build/native-tests --output-on-failure

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install the SDK packages this image actually offers
        shell: bash
        run: |
          set +e
          # Never hand a hard-coded package list to the SDK action: one package the image does not
          # offer (platforms;android-37 has been absent on this runner) aborts the setup step, and
          # the job dies before compiling or booting anything. Install what exists, log what does not.
          sdkmanager --list > /tmp/sdk-list.txt 2>&1
          grep -oE "platforms;android-[0-9.]+" /tmp/sdk-list.txt | sort -u > /tmp/avail-platforms.txt
          tail -12 /tmp/avail-platforms.txt
          want="emulator platform-tools build-tools;36.0.0 ndk;26.1.10909125 cmake;3.22.1 platforms;android-30"
          newest=$(grep -E "platforms;android-3[6-9]" /tmp/avail-platforms.txt | sort -V | tail -1)
          if [ -n "$newest" ]; then want="$want $newest"; fi
          echo "wanted: $want"
          for pkg in $want; do
            if ! grep -qF "$pkg" /tmp/sdk-list.txt; then
              echo "not offered by this image: $pkg"
              continue
            fi
            sdkmanager "$pkg" > "/tmp/sdk-install-$(echo "$pkg" | tr ';' '-').log" 2>&1
            echo "$pkg exit=$?"
          done
          exit 0
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

  debug-build:
