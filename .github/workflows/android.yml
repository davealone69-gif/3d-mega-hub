name: Android CI

on:
  push:
    branches: [main, "work/**", "fix/**", "integration/**"]
  pull_request:
    branches: [main, "work/**", "fix/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-regression:
    name: Native C++ sampling regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure host native tests
        run: cmake -S avatarforge-engine/src/main/cpp -B build/native-tests -DBUILD_TESTING=ON -DAF_OPT_FLAGS=-O1
      - name: Build native regression target
        run: cmake --build build/native-tests --parallel 2
      - name: Run native regression tests
        run: ctest --test-dir build/native-tests --output-on-failure

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"
          accept-android-sdk-licenses: true
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

  debug-build:
    name: Debug APK build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"
          accept-android-sdk-licenses: true
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon assembleDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: 3D-Mega-Hub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  release-minification-check:
    name: Release R8/minification check (no APK/AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"
          accept-android-sdk-licenses: true
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon minifyReleaseWithR8 --stacktrace

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"
          accept-android-sdk-licenses: true
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon lintDebug --stacktrace

  avatarforge-render-smoke:
    name: AvatarForge GLES GLB render smoke (instrumented)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # checks: write is used by one step only, to attach screenshot copies to the commit.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "emulator platform-tools platforms;android-30 platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"
          accept-android-sdk-licenses: true
      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real imported-GLB AvatarForge GLES renderer test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swangle -memory 4096 -cores 2 -no-snapshot -wipe-data
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash .github/scripts/avatarforge-render-smoke.sh
      - name: Publish small screenshot copies as check runs (readable through the API)
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Evidence only: nothing here may fail the job.
          python3 -m venv "$RUNNER_TEMP/screenshot-venv" || true
          "$RUNNER_TEMP/screenshot-venv/bin/pip" install --quiet pillow || true
          "$RUNNER_TEMP/screenshot-venv/bin/python" .github/scripts/publish_screenshot_check.py \
            "Emulator screenshot: generated avatar (GLES renderer)" \
            avatarforge-render-smoke-evidence/generated_avatar_diagnostic.png \
            "Emulator screenshot: last imported GLB (GLES renderer)" \
            avatarforge-render-smoke-evidence/imported_glb_diagnostic.png \
            "Emulator screenshot: screen after the renderer tests" \
            avatarforge-render-smoke-evidence/final-screen.png || true
      - name: Upload AvatarForge renderer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: avatarforge-gles-render-smoke-evidence
          path: avatarforge-render-smoke-evidence/
          if-no-files-found: warn
          retention-days: 14

