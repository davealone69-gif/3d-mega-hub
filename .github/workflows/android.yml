name: Android CI

on:
  push:
    branches: [main, "work/**", "fix/**", "integration/**"]
  pull_request:
    branches: [main, "work/**", "fix/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-regression:
    name: Native C++ sampling regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # A JNI signature mismatch is not a link error: the .so builds, the APK installs, and the failure
      # surfaces at the first call as an UnsatisfiedLinkError on a device. Checking it here costs one
      # second and needs no NDK, so it runs before the (much slower) native build.
      - name: Check JNI / Kotlin animation bridge parity
        run: python3 tools/check_jni_kotlin_parity.py
      - name: Configure host native tests
        run: cmake -S avatarforge-engine/src/main/cpp -B build/native-tests -DBUILD_TESTING=ON -DAF_OPT_FLAGS=-O1
      - name: Build native regression target
        run: cmake --build build/native-tests --parallel 2
      - name: Run native regression tests
        run: ctest --test-dir build/native-tests --output-on-failure

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"
          accept-android-sdk-licenses: true
      - run: chmod +x ./gradlew
      # Tee to a log and re-emit the interesting lines as workflow annotations. Job logs live on a
      # separate results host that is not always reachable, and "Process completed with exit code 1"
      # is not a diagnosis; annotations are readable through the API, so a red run explains itself.
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest --stacktrace 2>&1 | tee gradle-unit.log
      - name: Surface unit test failures as annotations
        if: failure()
        shell: bash
        run: |
          # GitHub caps annotations at 10 per level per run, so the budget is spent deliberately:
          # real failures first as errors, log context as notices. An earlier version listed every
          # testcase and consumed the entire error budget before reporting a single failure.
          python3 tools/ci_report_test_failures.py gradle-unit.log >> "$GITHUB_STEP_SUMMARY"
          python3 tools/ci_report_test_failures.py gradle-unit.log --commands


  debug-build:
    name: Debug APK build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"
          accept-android-sdk-licenses: true
      - run: chmod +x ./gradlew
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee gradle-apk.log
      # The native animation JNI is only compiled here: lint and R8 do not run externalNativeBuild, so
      # a C++ error in avatarforge_animation_jni.cpp shows up in this job and nowhere else.
      - name: Surface build failures as annotations
        if: failure()
        shell: bash
        run: |
          python3 tools/ci_report_test_failures.py gradle-apk.log >> "$GITHUB_STEP_SUMMARY"
          python3 tools/ci_report_test_failures.py gradle-apk.log --commands

      - uses: actions/upload-artifact@v7
        with:
          name: 3D-Mega-Hub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  release-minification-check:
    name: Release R8/minification check (no APK/AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"
          accept-android-sdk-licenses: true
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon minifyReleaseWithR8 --stacktrace

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"
          accept-android-sdk-licenses: true
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon lintDebug --stacktrace

  avatarforge-render-smoke:
    name: AvatarForge GLES GLB render smoke (instrumented)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "emulator platform-tools platforms;android-30 platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"
          accept-android-sdk-licenses: true
      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real imported-GLB AvatarForge GLES renderer test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swangle -memory 4096 -cores 2 -no-snapshot -wipe-data
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash .github/scripts/avatarforge-render-smoke.sh
      # Runs even if the emulator action timed out or the script died before its own reporting, which is
      # exactly when a diagnosis is most needed. Reads the tee'd Gradle log and whatever JUnit XML exists.
      - name: Report instrumented renderer failures
        if: always()
        run: |
          LOG=avatarforge-render-smoke-evidence/gradle-connected.log
          # The script reports before its own gates. This step only has to cover the case where it died
          # or the emulator action timed out first, so it stands down when the script already reported -
          # a duplicate would consume half of the 10-per-level annotation budget for nothing.
          if [[ -e avatarforge-render-smoke-evidence/.reported ]]; then
            echo "renderer script already reported; standing down to avoid duplicate annotations"
            exit 0
          fi
          CRASH_LOGS=(--crash-log avatarforge-render-smoke-evidence/logcat-crash.txt
                      --crash-log avatarforge-render-smoke-evidence/dropbox-crashes.txt
                      --crash-log avatarforge-render-smoke-evidence/avatarforge-logcat.txt
                      --crash-log avatarforge-render-smoke-evidence/logcat.txt)
          python3 tools/ci_report_test_failures.py "$LOG" --root . "${CRASH_LOGS[@]}" >> "$GITHUB_STEP_SUMMARY" || true
          python3 tools/ci_report_test_failures.py "$LOG" --root . "${CRASH_LOGS[@]}" --commands || true
          python3 tools/ci_report_test_failures.py "$LOG" --root . --counts || true
      - name: Upload AvatarForge renderer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: avatarforge-gles-render-smoke-evidence
          path: avatarforge-render-smoke-evidence/
          if-no-files-found: warn
          retention-days: 14

