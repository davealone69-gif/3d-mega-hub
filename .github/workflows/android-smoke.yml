name: Android Emulator Smoke

on:
  pull_request:
    branches: ["main", "work/**", "fix/**", "integration/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-smoke-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  install-launch-smoke:
    name: Emulator install and cold-launch smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"
          accept-android-sdk-licenses: true
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Install and cold-launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 4096
          disable-animations: true
          script: |
            set -euo pipefail
            APK="app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.davemega.hub
            adb shell am start -W -n com.davemega.hub/.MainActivity
            for attempt in $(seq 1 45); do
              if adb shell pidof com.davemega.hub >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            PID="$(adb shell pidof com.davemega.hub | tr -d '\r')"
            test -n "$PID"
            sleep 8
            adb shell dumpsys activity activities > /tmp/activities.txt
            grep -E "mResumedActivity|topResumedActivity" /tmp/activities.txt | grep -q "com.davemega.hub"
            adb logcat -d -v time > /tmp/emulator-logcat.txt
            if grep -E "FATAL EXCEPTION|Fatal signal|SIGABRT|Process: com.davemega.hub" /tmp/emulator-logcat.txt; then
              echo "App process crashed during cold launch."
              exit 1
            fi
            echo "PASS: package installed, MainActivity resumed, and no app-process fatal crash was recorded."
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 3D-Mega-Hub-cold-launch-smoke
          path: |
            /tmp/activities.txt
            /tmp/emulator-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
