name: Runtime evidence

# Level 2 and Level 3/4 evidence for the app: a real APK with its digests, then install, launch,
# screenshot analysis, crash capture and the instrumentation result — all republished as a pull
# request comment, because this repository's workflow logs and artifacts are served from hosts that
# are not always reachable.

on:
  pull_request:
    branches: [main, integration/avatarforge-renderer-port, "fix/**"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: runtime-evidence-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build and inspect the debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Resolve compile platform
        shell: bash
        run: |
          set +e
          sdkmanager --list > sdk-list.txt 2>&1
          PLATFORM=$(grep -oE "platforms;android-3[7-9][0-9.]*" sdk-list.txt | sort -uV | tail -1)
          echo "installing ${PLATFORM:-platforms;android-36}"
          sdkmanager "${PLATFORM:-platforms;android-36}" > install-platform.log 2>&1
          echo "install exit: $?"
          tail -3 install-platform.log

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug --console=plain > build-apk.log 2>&1
          echo "assembleDebug exit: $?"
          grep -E "^e: |FAILURE|BUILD (FAILED|SUCCESSFUL)" build-apk.log | tail -20
          ls -l app/build/outputs/apk/debug/ 2>/dev/null

      - name: Inspect the APK
        if: always()
        shell: bash
        run: |
          {
            echo "### Level 2: debug APK"
            APK=app/build/outputs/apk/debug/app-debug.apk
            if [ -f "$APK" ]; then
              echo '```text'
              ls -l "$APK"
              echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
              echo
              echo "--- badging ---"
              aapt2 dump badging "$APK" 2>/dev/null | grep -E "^(package|application-label|sdkVersion|targetSdkVersion|launchable-activity|native-code)" || \
                aapt dump badging "$APK" 2>/dev/null | grep -E "^(package|application-label|sdkVersion|targetSdkVersion|launchable-activity|native-code)"
              echo
              echo "--- native libraries ---"
              unzip -l "$APK" | grep -E "lib/.*\.so" || echo "no native libraries packaged"
              echo
              echo "--- dex ---"
              unzip -l "$APK" | grep -E "classes.*\.dex" || echo "no dex found"
              echo
              echo "--- signing ---"
              apksigner verify --print-certs "$APK" 2>&1 | head -6 || echo "apksigner unavailable"
              echo '```'
            else
              echo "No APK was produced."
              echo '```text'
              tail -25 build-apk.log
              echo '```'
            fi
          } > apk-summary.md
          cat apk-summary.md

      - name: Post the APK summary
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file apk-summary.md

      - name: Upload the APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  emulator:
    name: Install, launch and capture on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: apk
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "emulator platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build app and test APKs
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --console=plain --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and capture runtime evidence
        id: capture
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 4096 -cores 2
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash tools/ci/emulator_runtime_capture.sh

      - name: Post the runtime evidence
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          if [ -s runtime-evidence/summary.md ]; then
            # Keep the comment well inside GitHub's size limit.
            head -c 55000 runtime-evidence/summary.md > runtime-comment.md
          else
            {
              echo "### Runtime evidence"
              echo "The capture script produced nothing, which means the emulator never booted."
              echo "Boot failures happen before the script runs, so there is no device-side detail to show."
            } > runtime-comment.md
          fi
          gh pr comment "$PR" --body-file runtime-comment.md

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence
          path: runtime-evidence/
          if-no-files-found: warn
