name: AvatarForge diagnostic APK and tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "avatarforge-engine/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/avatarforge-diagnostic-apk.yml"

permissions:
  contents: read

concurrency:
  group: avatarforge-diagnostic-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Native host regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Verify dependency-free GLB anatomy probe
        run: |
          python3 -m py_compile tools/glb_anatomy_probe.py tools/test_glb_anatomy_probe.py
          python3 tools/test_glb_anatomy_probe.py
      - name: Verify the CI failure reporter
        run: |
          python3 -m py_compile tools/ci_report_test_failures.py tools/test_ci_report_test_failures.py
          python3 tools/test_ci_report_test_failures.py
      - name: Configure native host tests
        run: |
          cmake -S avatarforge-engine/src/main/cpp \
            -B build/avatarforge-host \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug
      - name: Build host regression executable
        run: |
          cmake --build build/avatarforge-host \
            --target af_glb_extension_test af_camera_frustum_test af_scene_visibility_test af_avatar_lod_test af_imported_glb_pbr_test \
            --parallel 2
      - name: Run WebP, PBR import and camera regression tests
        run: |
          ctest --test-dir build/avatarforge-host \
            --output-on-failure \
            -R "glb_extension_regression|camera_frustum_regression|scene_visibility_regression|avatar_lod_regression|imported_glb_pbr_regression"

  android-generated-avatar-test:
    name: Build debug APK and verify generated avatar pixels
    runs-on: ubuntu-latest
    needs: host-tests
    # 45 -> 60. This job boots TWO cold wiped emulators in sequence and runs Gradle twice, and each of
    # the two instrumented tests carries its own @Test timeout (600 s and 900 s). Run 44256596828 used
    # 17 of 45 minutes before failing, so this is headroom for a slow rasterizer rather than a fix for a
    # timeout - but a job that exceeds its own timeout reports nothing, which is worse than a slow one.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "emulator platform-tools platforms;android-30 platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"
          accept-android-sdk-licenses: true
      - name: Build diagnostic debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run PixelCopy diagnostic on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          AF_TEST_TARGET: com.davemega.hub.avatarforge.GeneratedAvatarRuntimeTest#generatedAvatarMustProduceVisiblePixels
          AF_EVIDENCE_DIR: avatarforge-diagnostic-pixelcopy-evidence
          # This step runs only GeneratedAvatarRuntimeTest, not AvatarForgeRendererSmokeTest, so the
          # gates on the smoke suite's own exports (PIXELS_VERIFIED, imported_glb_diagnostic.png, its
          # logcat markers) would fail here even with the test passing. Evidence is still collected.
          AF_REQUIRE_SMOKE_EVIDENCE: "0"
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -memory 4096 -cores 2 -no-window -no-audio -no-boot-anim -gpu swangle -no-snapshot -wipe-data
          emulator-boot-timeout: 900
          script: bash .github/scripts/avatarforge-render-smoke.sh
      - name: Run generated GLB through production GLES SurfaceView
        uses: reactivecircus/android-emulator-runner@v2
        env:
          AF_TEST_TARGET: com.davemega.hub.avatarforge.GeneratedAvatarRuntimeTest#generatedAvatarExportedGlbMustRenderThroughProductionSurfaceView
          AF_EVIDENCE_DIR: avatarforge-diagnostic-surfaceview-evidence
          AF_REQUIRE_SMOKE_EVIDENCE: "0"
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -memory 4096 -cores 2 -no-window -no-audio -no-boot-anim -gpu swangle -no-snapshot -wipe-data
          emulator-boot-timeout: 900
          script: bash .github/scripts/avatarforge-render-smoke.sh
      # Uploaded even when both test steps passed, and even when the emulator action itself timed out
      # before the script could report. Artifacts are not readable from a sandbox, but they are readable
      # from a browser, and they are the only place the raw logcat survives.
      - name: Upload instrumented evidence from both emulator runs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: avatarforge-diagnostic-instrumented-evidence
          path: |
            avatarforge-diagnostic-pixelcopy-evidence/
            avatarforge-diagnostic-surfaceview-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Collect diagnostic APK and test evidence
        if: always()
        run: |
          mkdir -p avatarforge-diagnostic-output
          if [ -s app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk avatarforge-diagnostic-output/3D-Mega-Hub-generated-avatar-diagnostic-debug.apk
            sha256sum avatarforge-diagnostic-output/3D-Mega-Hub-generated-avatar-diagnostic-debug.apk > avatarforge-diagnostic-output/SHA256SUMS
          fi
          if [ -d app/build/outputs/androidTest-results ]; then
            cp -R app/build/outputs/androidTest-results avatarforge-diagnostic-output/
          fi
          if [ -d app/build/reports/androidTests ]; then
            cp -R app/build/reports/androidTests avatarforge-diagnostic-output/
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: 3D-Mega-Hub-generated-avatar-diagnostic-debug-apk
          path: avatarforge-diagnostic-output/*
          if-no-files-found: warn
          retention-days: 14

