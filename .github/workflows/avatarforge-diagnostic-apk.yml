name: AvatarForge diagnostic APK and tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "avatarforge-engine/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/avatarforge-diagnostic-apk.yml"

permissions:
  contents: read

concurrency:
  group: avatarforge-diagnostic-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Native host regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Verify dependency-free GLB anatomy probe
        run: |
          python3 -m py_compile tools/glb_anatomy_probe.py tools/test_glb_anatomy_probe.py
          python3 tools/test_glb_anatomy_probe.py
      - name: Configure native host tests
        run: |
          cmake -S avatarforge-engine/src/main/cpp \
            -B build/avatarforge-host \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug
      - name: Build host regression executable
        run: |
          cmake --build build/avatarforge-host \
            --target af_glb_extension_test af_camera_frustum_test af_scene_visibility_test af_avatar_lod_test af_imported_glb_pbr_test \
            --parallel 2
      - name: Run WebP, PBR import and camera regression tests
        run: |
          ctest --test-dir build/avatarforge-host \
            --output-on-failure \
            -R "glb_extension_regression|camera_frustum_regression|scene_visibility_regression|avatar_lod_regression|imported_glb_pbr_regression"

  android-generated-avatar-test:
    name: Build debug APK and verify generated avatar pixels
    runs-on: ubuntu-latest
    needs: host-tests
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "emulator platform-tools platforms;android-30 platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"
          accept-android-sdk-licenses: true
      - name: Build diagnostic debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run PixelCopy diagnostic on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -memory 4096 -cores 2 -no-window -no-audio -no-boot-anim -gpu swangle -no-snapshot -wipe-data
          emulator-boot-timeout: 900
          script: bash .github/scripts/generated-runtime.sh com.davemega.hub.avatarforge.GeneratedAvatarRuntimeTest#generatedAvatarMustProduceVisiblePixels
      - name: Run generated GLB through production GLES SurfaceView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -memory 4096 -cores 2 -no-window -no-audio -no-boot-anim -gpu swangle -no-snapshot -wipe-data
          emulator-boot-timeout: 900
          script: bash .github/scripts/generated-runtime.sh com.davemega.hub.avatarforge.GeneratedAvatarRuntimeTest#generatedAvatarExportedGlbMustRenderThroughProductionSurfaceView
      - name: Collect diagnostic APK and test evidence
        if: always()
        run: |
          mkdir -p avatarforge-diagnostic-output
          if [ -s app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk avatarforge-diagnostic-output/3D-Mega-Hub-generated-avatar-diagnostic-debug.apk
            sha256sum avatarforge-diagnostic-output/3D-Mega-Hub-generated-avatar-diagnostic-debug.apk > avatarforge-diagnostic-output/SHA256SUMS
          fi
          if [ -d app/build/outputs/androidTest-results ]; then
            cp -R app/build/outputs/androidTest-results avatarforge-diagnostic-output/
          fi
          if [ -d app/build/reports/androidTests ]; then
            cp -R app/build/reports/androidTests avatarforge-diagnostic-output/
          fi
          if [ -d artifacts/avatarforge ]; then
            cp -R artifacts/avatarforge avatarforge-diagnostic-output/
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: 3D-Mega-Hub-generated-avatar-diagnostic-debug-apk
          path: avatarforge-diagnostic-output/*
          if-no-files-found: warn
          retention-days: 14

