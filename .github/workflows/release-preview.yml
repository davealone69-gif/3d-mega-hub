name: Release preview and Android emulator smoke

on:
  workflow_dispatch:
  push:
    branches: ["work/engine-integration-candidate"]
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "avatarforge-engine/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/release-preview.yml"

permissions:
  contents: read

jobs:
  signed-preview:
    name: Signed release preview (ephemeral CI key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"
          accept-android-sdk-licenses: true
      - name: Create one-run preview signing identity
        shell: bash
        run: |
          set -euo pipefail
          STORE="$RUNNER_TEMP/3d-mega-hub-preview.jks"
          STORE_PASS="$(openssl rand -hex 24)"
          echo "ANDROID_RELEASE_STORE_FILE=$STORE" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_ALIAS=preview" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          keytool -genkeypair -noprompt -keystore "$STORE" -storetype JKS \
            -storepass "$STORE_PASS" -keypass "$STORE_PASS" -alias preview \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=3D Mega Hub CI Preview,O=Ephemeral Build,C=AU"
      - name: Test and build signed release APK and AAB
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest lintDebug assembleRelease bundleRelease
      - name: Verify signatures and produce provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-preview
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"
          cp "$APK" release-preview/3D-Mega-Hub-preview-release.apk
          cp "$AAB" release-preview/3D-Mega-Hub-preview-release.aab

          # setup-android installs Build Tools, but does not guarantee apksigner is on PATH.
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -u+x -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs release-preview/3D-Mega-Hub-preview-release.apk | tee release-preview/apk-signature.txt
          jarsigner -verify -verbose -certs release-preview/3D-Mega-Hub-preview-release.aab > release-preview/aab-signature.txt
          sha256sum release-preview/*.apk release-preview/*.aab | tee release-preview/SHA256SUMS
          keytool -list -v -keystore "$ANDROID_RELEASE_STORE_FILE" \
            -storepass "$ANDROID_RELEASE_STORE_PASSWORD" -alias "$ANDROID_RELEASE_KEY_ALIAS" \
            > release-preview/ephemeral-certificate.txt
          cat > release-preview/IMPORTANT.txt <<'EOF'
          PREVIEW SIGNING ONLY
          This APK and AAB are signed with a randomly generated, one-run CI key.
          The private key is intentionally not retained. These artifacts are suitable
          for installation/testing, but cannot receive future in-place updates signed
          with this identity and are NOT the production release signing identity.
          Configure a user-owned release keystore in protected CI secrets for production.
          Samsung SM-S921B runtime is not proven by this workflow.
          EOF
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: 3D-Mega-Hub-signed-preview
          path: release-preview/*
          if-no-files-found: ignore
          retention-days: 14

  emulator-launch:
    name: Android emulator install and launch smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"
          accept-android-sdk-licenses: true
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Prepare emulator diagnostics
        if: always()
        run: mkdir -p emulator-diagnostics
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            adb wait-for-device
            for attempt in $(seq 1 180); do
              BOOTED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$BOOTED" = "1" ]; then break; fi
              sleep 5
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.davemega.hub
            adb shell am start -W -n com.davemega.hub/.MainActivity
            sleep 10
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | grep -q "com.davemega.hub"
            PID="$(adb shell pidof -s com.davemega.hub | tr -d '\r')"
            test -n "$PID"
            adb logcat --pid="$PID" -d > emulator-diagnostics/app-logcat.txt
            if grep -E "FATAL EXCEPTION|Fatal signal|Process: com.davemega.hub" emulator-diagnostics/app-logcat.txt; then
              echo "Application crash detected in app-scoped emulator logcat"
              exit 1
            fi
            adb exec-out screencap -p > emulator-diagnostics/launch-screen.png
            printf 'INSTALL=PASS\nLAUNCH=PASS\nPROCESS_ID=%s\n' "$PID" > emulator-diagnostics/result.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: 3D-Mega-Hub-emulator-smoke-diagnostics
          path: emulator-diagnostics/*
          if-no-files-found: ignore
          retention-days: 14
