name: AvatarForge generated-avatar runtime verification

on:
  pull_request:
    branches:
      - main
      - fix/mega-hub-candidate-hardening
      - integration/avatarforge-renderer-port
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avatarforge-generated-runtime-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  generated-avatar-runtime:
    name: Generate, render and inspect real avatar pixels
    runs-on: ubuntu-latest
    # 45 -> 60. The shared script runs Gradle with --no-daemon and now also collects logcat, the crash
    # buffer, dropbox and tombstones, and this job boots a cold wiped emulator before running four tests
    # whose own @Test timeouts total 45 minutes worst case. A job that exceeds its timeout reports
    # nothing at all, which is the one outcome worse than a slow one.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "emulator platform-tools platforms;android-30 platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"
          accept-android-sdk-licenses: true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run generated-avatar instrumentation test
        # Same reporting path as the other two instrumented jobs. This one failed on head 6a32184 after
        # 13m08s with no annotation at all, which is the exact blind spot the shared script exists to
        # close: without it the only reachable signal is "sh failed with exit code 1".
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -memory 4096 -cores 2 -no-window -no-audio -no-boot-anim -gpu swangle -camera-back none -no-snapshot -wipe-data
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            set +e
            # Runs the whole GeneratedAvatarRuntimeTest class through the shared instrumented script, so
            # this job gets the same annotations, job summary and XML-derived gate as the other two
            # instead of only "sh failed with exit code 1". The captures below are kept because they
            # collect things that script does not: the emulator display, and the app's own diagnostics
            # directory via run-as with a SHA-256 manifest.
            export AF_TEST_TARGET=com.davemega.hub.avatarforge.GeneratedAvatarRuntimeTest
            export AF_EVIDENCE_DIR=avatarforge-generated-runtime-evidence
            export AF_REQUIRE_SMOKE_EVIDENCE=0
            bash .github/scripts/avatarforge-render-smoke.sh
            test_status=$?
            mkdir -p artifacts/avatarforge/runtime-captures
            # Capture the emulator display independently of app storage as a fallback.
            # The instrumentation test's actual avatar PNGs/JSON live in internal app files;
            # retrieve them through run-as, which works with the debuggable test APK and
            # avoids Android 11+ scoped-storage restrictions on /Android/data.
            adb exec-out screencap -p > artifacts/avatarforge/runtime-captures/emulator-screen.png || true
            adb shell pm list packages | grep -F com.davemega.hub > artifacts/avatarforge/runtime-captures/installed-packages.txt || true
            adb exec-out sh -c 'run-as com.davemega.hub sh -c "cd files/avatarforge-diagnostics && tar -cf - ."' > artifacts/avatarforge/runtime-captures/avatarforge-diagnostics.tar 2> artifacts/avatarforge/runtime-captures/run-as-error.txt || true
            test ! -s artifacts/avatarforge/runtime-captures/avatarforge-diagnostics.tar || tar -xf artifacts/avatarforge/runtime-captures/avatarforge-diagnostics.tar -C artifacts/avatarforge/runtime-captures/
            find artifacts/avatarforge/runtime-captures -type f -printf '%p %s bytes\\n'
            echo "build_commit=${GITHUB_SHA}" > artifacts/avatarforge/runtime-captures/evidence-manifest.txt
            echo "capture_time_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> artifacts/avatarforge/runtime-captures/evidence-manifest.txt
            find artifacts/avatarforge/runtime-captures -type f ! -name evidence-manifest.txt -print0 | sort -z | xargs -0 -r sha256sum >> artifacts/avatarforge/runtime-captures/evidence-manifest.txt
            cat artifacts/avatarforge/runtime-captures/evidence-manifest.txt
            exit $test_status

      - name: Upload instrumentation reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: avatarforge-generated-runtime-evidence
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            artifacts/avatarforge/
            avatarforge-generated-runtime-evidence/

