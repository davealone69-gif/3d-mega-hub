name: AvatarForge generated-avatar runtime verification

on:
  push:
    branches: ["arena/**", "integration/**"]
  pull_request:
    branches:
      - main
      - fix/mega-hub-candidate-hardening
      - integration/avatarforge-renderer-port
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avatarforge-generated-runtime-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  generated-avatar-runtime:
    name: Generate, render and inspect real avatar pixels
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install the SDK packages this image actually offers
        shell: bash
        run: |
          set +e
          # Never hand a hard-coded package list to the SDK action: one package the image does not
          # offer (platforms;android-37 has been absent on this runner) aborts the setup step, and
          # the job dies before compiling or booting anything. Install what exists, log what does not.
          sdkmanager --list > /tmp/sdk-list.txt 2>&1
          grep -oE "platforms;android-[0-9.]+" /tmp/sdk-list.txt | sort -u > /tmp/avail-platforms.txt
          tail -12 /tmp/avail-platforms.txt
          want="emulator platform-tools build-tools;36.0.0 ndk;26.1.10909125 cmake;3.22.1 platforms;android-30"
          newest=$(grep -E "platforms;android-3[6-9]" /tmp/avail-platforms.txt | sort -V | tail -1)
          if [ -n "$newest" ]; then want="$want $newest"; fi
          echo "wanted: $want"
          for pkg in $want; do
            if ! grep -qF "$pkg" /tmp/sdk-list.txt; then
              echo "not offered by this image: $pkg"
              continue
            fi
            sdkmanager "$pkg" > "/tmp/sdk-install-$(echo "$pkg" | tr ';' '-').log" 2>&1
            echo "$pkg exit=$?"
          done
          exit 0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run generated-avatar instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -memory 4096 -cores 2 -no-window -no-audio -no-boot-anim -gpu swangle -camera-back none -no-snapshot -wipe-data
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            set +e
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.davemega.hub.avatarforge.GeneratedAvatarRuntimeTest --stacktrace 2>&1 | tee instrumentation.log
            test_status=${PIPESTATUS[0]}
            mkdir -p artifacts/avatarforge/runtime-captures
            # Capture independently of app-private storage: the test runner may remove the
            # target package after instrumentation, making run-as unavailable. Public Downloads
            # is already where renderer_diagnostics.json is exported by the app.
            adb exec-out screencap -p > artifacts/avatarforge/runtime-captures/emulator-screen.png 2> artifacts/avatarforge/runtime-captures/screencap-error.txt || true
            adb shell pm list packages > artifacts/avatarforge/runtime-captures/installed-packages.txt 2>&1 || true
            adb exec-out sh -c 'run-as com.davemega.hub sh -c "cd files/avatarforge-diagnostics && tar -cf - ."' > artifacts/avatarforge/runtime-captures/avatarforge-diagnostics.tar 2> artifacts/avatarforge/runtime-captures/run-as-error.txt || true
            if [ -s artifacts/avatarforge/runtime-captures/avatarforge-diagnostics.tar ] && tar -tf artifacts/avatarforge/runtime-captures/avatarforge-diagnostics.tar >/dev/null 2>&1; then
              tar -xf artifacts/avatarforge/runtime-captures/avatarforge-diagnostics.tar -C artifacts/avatarforge/runtime-captures/
            else
              echo "App-private archive unavailable after instrumentation; see run-as-error.txt. This does not change the instrumentation verdict." > artifacts/avatarforge/runtime-captures/private-capture-status.txt
              rm -f artifacts/avatarforge/runtime-captures/avatarforge-diagnostics.tar
            fi
            adb pull "/sdcard/Download/3D Mega Hub Diagnostics" artifacts/avatarforge/runtime-captures/download-diagnostics > artifacts/avatarforge/runtime-captures/adb-pull.log 2>&1 || true
            find artifacts/avatarforge/runtime-captures -type f -printf '%p %s bytes\\n' || true
            echo "build_commit=${GITHUB_SHA}" > artifacts/avatarforge/runtime-captures/evidence-manifest.txt
            echo "capture_time_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> artifacts/avatarforge/runtime-captures/evidence-manifest.txt
            find artifacts/avatarforge/runtime-captures -type f ! -name evidence-manifest.txt -print0 | sort -z | xargs -0 -r sha256sum >> artifacts/avatarforge/runtime-captures/evidence-manifest.txt
            cat artifacts/avatarforge/runtime-captures/evidence-manifest.txt
            exit $test_status

      - name: Publish the outcome where it can be read
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          {
            echo "### Generated-avatar runtime verification"
            echo
            echo "commit: \`${GITHUB_SHA}\` · run: ${GITHUB_RUN_ID}"
            echo
            if grep -qE "FAILURES|Process crashed" instrumentation.log 2>/dev/null; then
              echo "**Instrumentation failed.** Tail of the run:"
              echo '```text'
              grep -E "FAILURES|Process crashed|Tests on|INSTRUMENTATION" instrumentation.log | tail -6
              echo '```'
            else
              echo "Instrumentation output tail:"
              echo '```text'
              tail -5 instrumentation.log 2>/dev/null || echo "no instrumentation log"
              echo '```'
            fi
            EXC=artifacts/avatarforge/runtime-captures/crash-excerpt.txt
            if [ -s "$EXC" ]; then
              echo
              echo "**Native/Java crash excerpt:**"
              echo '```text'
              head -30 "$EXC"
              echo '```'
            fi
          } > runtime-comment.md
          cat runtime-comment.md
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file runtime-comment.md
          fi

      - name: Upload instrumentation reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: avatarforge-generated-runtime-evidence
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            artifacts/avatarforge/


