name: AvatarForge generated-avatar runtime verification

on:
  push:
    branches:
      - integration/avatarforge-renderer-port
  pull_request:
    branches:
      - main
      - fix/mega-hub-candidate-hardening
      - integration/avatarforge-renderer-port
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avatarforge-generated-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-avatar-runtime:
    name: Generate, render and inspect real avatar pixels
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android components
        run: |
          sdkmanager "emulator" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run generated-avatar instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -memory 4096 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          script: |
            set +e
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
            test_status=$?
            mkdir -p artifacts/avatarforge
            adb pull /sdcard/Android/data/com.davemega.hub/files/failed_render.png artifacts/avatarforge/failed_render.png || true
            exit $test_status

      - name: Upload instrumentation reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatarforge-generated-runtime-evidence
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            artifacts/avatarforge/
