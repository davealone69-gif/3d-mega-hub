name: AvatarForge generated-avatar runtime verification

on:
  pull_request:
    branches:
      - main
      - fix/mega-hub-candidate-hardening
      - integration/avatarforge-renderer-port
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avatarforge-generated-runtime-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  generated-avatar-runtime:
    name: Generate, render and inspect real avatar pixels
    runs-on: ubuntu-latest
    # 45 -> 60. The shared script runs Gradle with --no-daemon and now also collects logcat, the crash
    # buffer, dropbox and tombstones, and this job boots a cold wiped emulator before running four tests
    # whose own @Test timeouts total 45 minutes worst case. A job that exceeds its timeout reports
    # nothing at all, which is the one outcome worse than a slow one.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "emulator platform-tools platforms;android-30 platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"
          accept-android-sdk-licenses: true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run generated-avatar instrumentation test
        # Same reporting path as the other two instrumented jobs. This one failed on head 6a32184 after
        # 13m08s with no annotation at all, which is the exact blind spot the shared script exists to
        # close: without it the only reachable signal is "sh failed with exit code 1".
        uses: reactivecircus/android-emulator-runner@v2
        # Step-level env, NOT exports inside the script block. Run 44262469686 exported these three
        # inside `script:` and the child bash never saw them, so the shared script fell back to its
        # defaults: it ran all seven tests of both classes instead of this job's four, and re-enabled the
        # AvatarForgeRendererSmokeTest presentation gates that this job cannot satisfy. All seven tests
        # passed and the step still exited 2. avatarforge-diagnostic-apk.yml uses step-level env for the
        # same three variables and both of its steps reported exactly the one test each requested.
        env:
          AF_TEST_TARGET: com.davemega.hub.avatarforge.GeneratedAvatarRuntimeTest
          AF_EVIDENCE_DIR: avatarforge-generated-runtime-evidence
          AF_REQUIRE_SMOKE_EVIDENCE: "0"
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -memory 4096 -cores 2 -no-window -no-audio -no-boot-anim -gpu swangle -camera-back none -no-snapshot -wipe-data
          emulator-boot-timeout: 900
          disable-animations: true
          # One command, so this script's exit status is the step's. The block that used to be here
          # captured `test_status=$?` and ended with `exit "$test_status"`; the variable crossed the
          # emulator action's shell boundary EMPTY and `exit ""` is an illegal number in POSIX sh, so the
          # step exited 2 with tests=4 failures=0 (run 44276642189). The screencap, run-as diagnostics
          # tar and SHA-256 manifest it produced are now collected by the shared script into
          # AF_EVIDENCE_DIR, which the upload step below already publishes.
          script: bash .github/scripts/avatarforge-render-smoke.sh

      - name: Upload instrumentation reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: avatarforge-generated-runtime-evidence
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            artifacts/avatarforge/
            avatarforge-generated-runtime-evidence/

